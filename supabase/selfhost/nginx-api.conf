# /etc/nginx/sites-available/api.photorank — TLS is added by `certbot --nginx`.
server {
    server_name api.example.com;
    listen 80;
    listen [::]:80;

    client_max_body_size 6m;          # entries are ≤ ~300 KB; sets upload one file at a time
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
    }
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3010/;
    }
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_request_buffering off;
    }
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    # The PWA (flutter build web) — see tool/deploy_web.sh.
    root /var/www/photorank;
    index index.html;
    location = /sqlite3.wasm { types {} default_type application/wasm; add_header Cache-Control "public, max-age=604800"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-cache"; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
