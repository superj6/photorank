name: Release
# Push a tag like v1.1.0 to build every platform and attach the binaries.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  FLUTTER_VERSION: 3.47.1
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1', cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Release signing (skipped if secrets are absent → debug key)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=upload
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/photorank-${GITHUB_REF_NAME}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/photorank-${GITHUB_REF_NAME}-android.aab"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1', cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - run: |
          mkdir -p out
          tar -C build/linux/x64/release/bundle -czf "out/photorank-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.1', cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "out\photorank-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  release:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Android**: install the `.apk` (allow installs from this source). The `.aab` is for Google Play.
            **Linux**: extract the tarball and run `./photorank` (needs GTK 3; `sudo apt install libgtk-3-0`).
            **Windows**: extract the zip and run `photorank.exe`. The build is unsigned, so SmartScreen will warn — choose "More info → Run anyway".
            Photos never leave your device. See `docs/PRIVACY.md`.
